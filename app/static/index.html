  <script>tailwind.config = { theme: { extend: { colors: { ink: "#f3f1ea", mu: "#a29eb0", gold: "#e8c27a", cy: "#5ad1ff", vio: "#7c6cff", low: "#5be3a1", medium: "#f2c14e", high: "#ff5d6c" }, fontFamily: { sans: ["Manrope", "system-ui", "sans-serif"], mono: ["JetBrains Mono", "monospace"] } } } }</script>
  <style>
    body {
      background: #07070a;
      color: #f3f1ea;
      overflow-x: hidden;
      background-image: radial-gradient(1px 1px at 12% 18%, #fff8, transparent), radial-gradient(1px 1px at 78% 12%, #fff6, transparent), radial-gradient(1.5px 1.5px at 44% 32%, #fff7, transparent), radial-gradient(1px 1px at 90% 55%, #fff5, transparent), radial-gradient(1px 1px at 22% 62%, #fff6, transparent);
      background-size: 640px 640px
    }

    #torch {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 40%), rgba(124, 108, 255, .075), rgba(232, 194, 122, .04) 40%, transparent 70%)
    }

    .blob {
      position: fixed;
      left: 50%;
      bottom: -34vh;
      width: min(980px, 130vw);
      aspect-ratio: 1.15;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.4s, transform 1.4s cubic-bezier(.2, .7, .2, 1);
      border-radius: 46% 54% 52% 48%/58% 44% 56% 42%;
      animation: morph 16s ease-in-out infinite alternate;
      background: radial-gradient(ellipse at 28% 22%, rgba(255, 214, 140, .9), transparent 34%), radial-gradient(ellipse at 72% 28%, rgba(255, 196, 120, .55), transparent 38%), radial-gradient(ellipse at 50% 86%, rgba(70, 110, 255, .6), transparent 52%), #0c0b10;
      box-shadow: inset 0 0 90px rgba(255, 220, 160, .3), inset -40px -30px 120px rgba(80, 120, 255, .3), 0 0 60px rgba(232, 194, 122, .14)

    .docked .blob {
      opacity: .2;
      transform: translateX(-50%) translateY(14vh) scale(.9)
    }

    @keyframes morph {
      0% {
        border-radius: 46% 54% 52% 48%/58% 44% 56% 42%;
        rotate: -2deg

        border-radius: 56% 44% 42% 58%/48% 56% 44% 52%;
        rotate: 2deg
      }

      100% {
        border-radius: 44% 56% 58% 42%/54% 46% 54% 46%;

      }
    }

    .glass {

      overflow: hidden;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px)
    }

    .glass:before,
    .glass:after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s
    }

    .glass:before {
      background: radial-gradient(260px circle at var(--x, -999px) var(--y, -999px), rgba(232, 194, 122, .08), transparent 70%)
    }

    .glass:after {
      padding: 1px;
      background: radial-gradient(180px circle at var(--x, -999px) var(--y, -999px), rgba(255, 255, 255, .4), transparent 70%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0)
    }

    .glass:hover:before,
    .glass:hover:after {
      opacity: 1
    }

    .gridbg {
      background-color: #08080d;
      background-image: linear-gradient(rgba(124, 108, 255, .13) 1px, transparent 1px), linear-gradient(90deg, rgba(124, 108, 255, .13) 1px, transparent 1px), radial-gradient(600px circle at 70% 0%, rgba(232, 194, 122, .1), transparent 70%);
      background-size: 28px 28px, 28px 28px, 100% 100%
    }

    .rise {
      opacity: 0;
      animation: rise 1s cubic-bezier(.2, .7, .2, 1) forwards;
      animation-delay: calc(var(--i, 0)*110ms)
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.985);
        filter: blur(10px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    .pop {
      animation: pop .25s cubic-bezier(.2, .7, .2, 1)
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.97)
      }
    }

    .blip {
      animation: blip .9s ease-in-out 1.4s 2
    }

    @keyframes blip {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 93, 108, 0)
      }

      50% {
        box-shadow: 0 0 24px 7px rgba(255, 93, 108, .75);
        border-color: #ff5d6c;
        color: #fff
      }
    }

    .busy:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(90, 209, 255, .18) 50%, transparent 70%);
      animation: scan 1.1s linear infinite
    }

    @keyframes scan {
      from {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(100%)
      }
    }

    .marq {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent)
    }

    .marq-track {
      animation: marq var(--d, 45s) linear infinite
    }

    .marq:hover .marq-track.pause {
      animation-play-state: paused
    }

    .marq-track.rev {
      animation-direction: reverse
    }

    @keyframes marq {
      to {
        transform: translateX(-50%)
      }
    }

    .spin {
      animation: rot .8s linear infinite
    }

    @keyframes rot {
      to {
        transform: rotate(360deg)
      }
    }

    mark {
      background: rgba(255, 93, 108, .22);
      color: #fff;
      border-bottom: 2px solid #ff5d6c;
      border-radius: 4px;
      padding: 0 3px;
      transition: all .2s
    }

    mark.hot {
      background: rgba(232, 194, 122, .3);
      border-color: #e8c27a;
      box-shadow: 0 0 14px rgba(232, 194, 122, .5)
    }

    .sb {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .18) transparent
    }

    .node.on {
      animation: pulse 2.4s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 8px rgba(255, 93, 108, .2)
      }
    }

    .steps {
      counter-reset: s
    }

    .steps li {
      counter-increment: s
    }

    .steps li:before {
      content: counter(s)
    }

    @media(hover:none) {
      #torch {
        display: none
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      .rise {
        opacity: 1
      }
    }
  </style>
</head>

    const STACK = [["Python", "python"], ["FastAPI", "fastapi"], ["Pydantic", "pydantic"], ["LangChain", "langchain"], ["Claude", "claude"], ["Gemini", "googlegemini"], ["React", "react"], ["Tailwind CSS", "tailwindcss"], ["Lucide", "lucide"], ["Docker", "docker"], ["Hugging Face", "huggingface"], ["pytest", "pytest"], ["uv", "uv"]];
    const SOCIAL = [["WhatsApp", "whatsapp", t => "https://wa.me/?text=" + t], ["Telegram", "telegram", t => "https://t.me/share/url?url=" + encodeURIComponent(location.origin) + "&text=" + t], ["X", "x", t => "https://twitter.com/intent/tweet?text=" + t], ["LinkedIn", "linkedin", t => "https://www.linkedin.com/feed/?shareActive=true&text=" + t], ["Facebook", "facebook", t => "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(location.origin) + "&quote=" + t], ["Email", "gmail", t => "mailto:?subject=Scam%20alert&body=" + t]];
    async function api(p, b) { const r = await fetch(p, b ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) } : {}); if (!r.ok) throw new Error("Server error " + r.status); return r.json() }
    const seedGen = () => Math.random().toString(16).slice(2, 6).toUpperCase();
    const TS = /^\s*\[?\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[ap]m)?\]?\s*[-–]?\s*/i;
    function splitMsgs(t) {
      const out = []; let cur = null; t.split(/\r?\n/).forEach(l => { if (TS.test(l)) { if (cur) out.push(cur); cur = l.replace(TS, "") } else if (cur !== null) cur += "\n" + l; else if (l.trim()) cur = l }); if (cur) out.push(cur);
      if (out.length > 1) return out.map(s => s.trim()).filter(Boolean); return t.split(/\n\s*\n|\n-{3,}\n/).map(s => s.trim()).filter(Boolean)
    }

      x.fillStyle = "#fff"; x.font = `700 56px ${F}`; x.fillText("HeilR", 70, 112);

      x.fillStyle = "#fff"; x.font = `700 76px ${F}`; let y = wrap(x, c.t, 70, 290, 940, 86);
      x.fillStyle = "#e8c27a"; x.font = `600 24px ${F}`; x.fillText("WHAT IT LOOKS LIKE", 70, y + 14);
      x.fillStyle = "#f3f1ea"; x.font = `italic 300 38px ${F}`; y = wrap(x, c.ex, 70, y + 64, 940, 50);
      x.fillStyle = "#e8c27a"; x.font = `600 24px ${F}`; x.fillText("THE TELL-TALE SIGN", 70, y + 16);
      x.fillStyle = "#f3f1ea"; x.font = `400 36px ${F}`; wrap(x, c.tip, 70, y + 66, 940, 48);
      x.fillStyle = "rgba(255,255,255,.07)"; x.beginPath(); if (x.roundRect) x.roundRect(60, 800, 960, 200, 28); else x.rect(60, 800, 960, 200); x.fill();
      x.fillStyle = "#5be3a1"; x.font = `600 24px ${F}`; x.fillText("WHAT TO DO", 90, 842);

    function Marked({ text, flags, hot }) {
      const rs = flags.flatMap((f, i) => f.spans.map(s => [s[0], s[1], i])).sort((a, b) => a[0] - b[0]); const out = []; let p = 0;

    const About = () => h`<div class="space-y-3">
 ${Sec("What it is", h`<p>HeilR helps students judge a suspicious message, email or link in plain language. It returns a risk rating, the exact phrases and links that look wrong, and clear next steps. It never opens a link and never sends anything.</p>`)}
 ${Sec("How it works", Li(["Your text is cleaned (hidden characters and look-alike letters removed).", "Rules look for pressure, fee requests, OTP/PIN requests, fake prizes and refunds, too-good job offers and risky links.", "Brand names are read in context: 'Google HR' is an identity claim, 'Google Form' is just a tool.", "Sender and link domains are compared with the real domains of the named company.", "Points add up to Low, Medium or High. Official college or government links and 'never share your OTP' warnings count in the message's favour.", "An optional AI step explains the findings in friendly words. It never sets the rating."]))}
 ${Sec("Where it helps", Li(["Checking an internship, scholarship or refund message before paying or clicking.", "Checking a whole pasted chat at once (Bulk).", "Class and placement-cell groups: share an awareness card, or report a scam type anonymously to the campus chart.", "Awareness sessions, using the built-in scam library."]))}
 ${Sec("How it is built", h`<p>A Python engine (FastAPI, Pydantic) makes the decision. A LangChain-wrapped language model adds a guarded explanation: input is redacted, output is validated, and any failure falls back to the engine. Campus reports go to a small CSV file holding only the date and scam type. The interface is React with Tailwind and Lucide icons, packaged in Docker for Hugging Face.</p>`)}
 ${Sec("Limits", h`<p>It is rule-based guidance, not a guarantee. A low rating does not prove a message is safe, and a new scam wording can slip through.</p>`)}</div>`;

    function Clock() {

    function Pie({ items }) {

  ${modal === "help" && h`<${Modal} title="How to use HeilR" icon="HelpCircle" onClose=${() => setM(null)}><${Help}/><//>`}
  ${modal === "stats" && h`<${Stats} onClose=${() => setM(null)}/>`}
  ${modal === "share" && sc && h`<${ShareModal} c=${sc} onClose=${() => setM(null)}/>`}
  ${modal === "bulk" && h`<${BulkModal} rows=${rows} onPick=${x => { setT(x); setBk(false); run(x) }} onClose=${() => setM(null)}/>`}</div>`
    }

    class EB extends React.Component {
      constructor(p) { super(p); this.state = { e: null } }
      static getDerivedStateFromError(e) { return { e } }
      componentDidCatch(e, i) { console.error("HeilR UI crash:", e, i) }
      render() { return this.state.e ? h`<div class="glass mx-auto mt-10 max-w-lg rounded-2xl p-4" role="alert"><b>Display error.</b><div class="font-mono text-xs text-mu">${String(this.state.e && (this.state.e.message || this.state.e))}</div><button class="mt-2 rounded-xl border border-white/15 px-3 py-1" onClick=${() => location.reload()}>Reload</button></div>` : this.props.children }
    }
    createRoot(document.getElementById("root")).render(h`<${EB}><${App}/><//>`);
  </script>
</body>

</html>
